<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>미니도희 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* ==================================================================
   ✏️ 설정 — 이 부분만 고치면 됩니다
   ------------------------------------------------------------------
   · pages 의 첫 번째 = 메인(광고 스케줄). 나머지 = 카테고리 탭
   · file    : 저장소 안 CSV 경로 (구글시트 → 파일 → 다운로드 → CSV)
   · 달력 모양 시트("10월 스케줄" 형태)는 자동으로 달력으로 인식합니다
   · layer   : 달력 시트를 메인 달력에 어떤 이름/색(1~3)으로 겹칠지
   · dateLayer : 표 시트의 날짜 열을 메인 달력에 같이 띄우기
   · filters : 표 위에 드롭다운 필터로 만들 열 이름
   · badges  : 배지 모양으로 표시할 열 이름
   · hide    : 화면에서 숨길 열 이름 (예: 연락처, 단가)
   · tab:false : 별도 탭 없이 메인 달력에만 데이터로 사용
   ================================================================== */
const CONFIG = {
  title: "미니도희 대시보드",
  subtitle: "민도희 · 담당자 & 크리에이터 공유 보드",
  startYear: 2026,            // 달력 시트의 첫 달이 속한 연도 (10월~1월이면 1월은 자동으로 +1년)
  pages: [
    { id: "home", label: "광고 스케줄", type: "home" },
    { id: "upload", label: "업로드·광고 스케줄", file: "data/upload-schedule.csv", tab: false,   // 메인 달력에만 표시
      layer: { label: "업로드·광고", color: 1 } },
    { id: "channel", label: "채널 성과", file: "data/channel.csv" },
    { id: "personal", label: "개인 스케줄", file: "data/personal-schedule.csv",
      layer: { label: "개인 일정", color: 2 } },
    { id: "inquiries", label: "광고·협찬 문의", file: "data/ad-inquiries.csv",
      filters: ["유형", "카테고리", "소통 현황", "진행확정 여부"],
      badges: ["유형", "소통 현황", "진행확정 여부"],
      hide: [],
      dateLayer: { col: "희망 일정(업로드)", titleCols: ["브랜드", "제품명"], label: "광고 희망 업로드일", color: 3 } },
    { id: "contents", label: "콘텐츠 진행사항", file: "data/contents.csv",
      filters: ["반응", "포맷(콘텐츠 유형)", "구분"],
      badges: ["포맷(콘텐츠 유형)", "반응"],
      // 반응 좋은 콘텐츠: 같은 포맷(롱폼/숏폼)끼리 중앙값과 비교
      reaction: { groupCol: "포맷(콘텐츠 유형)", titleCol: "콘텐츠 제목", viewsCol: "조회수", likeCol: "좋아요", commentCol: "댓글수",
                  hot: 5,       // 조회수가 같은 포맷 중앙값의 5배 이상 → 🔥 화제
                  high: 2,      // 2배 이상 → 👍 조회수 높음
                  engage: 1.5,  // (좋아요+댓글)/조회수 가 중앙값의 1.5배 이상 → 💬 참여율 높음
                  top: 3 },     // 포맷별 TOP 몇 개 보여줄지
      sort: { col: "업로드 날짜", dir: -1 },
      dateLayer: { col: "업로드 날짜", titleCols: ["콘텐츠 제목"], label: "업로드 완료", color: 0, off: true } }
  ],
  // 채널 성과 시트의 "구분" 열 이름 (시트에서 이름을 바꾸면 여기도 같이 바꿔주세요)
  channel: {
    page: "channel",
    ytSubs: "YT 구독자", ytLong: "YT 롱폼 조회수", ytShort: "YT 숏폼 조회수",
    igFollowers: "IG 팔로워", igViews: "IG 조회수", reactions: "반응수", target: "주요 타깃",
    targetPlatform: { 2: "인스타그램", 7: "유튜브", 9: "유튜브" }   // 주요 타깃이 어느 플랫폼 기준인지 (월: 플랫폼)
  },
  home: {
    inquiries: { page: "inquiries", typeCol: "유형" },
    contents:  { page: "contents", dateCol: "업로드 날짜", titleCol: "콘텐츠 제목", viewsCol: "조회수", formatCol: "포맷(콘텐츠 유형)" }
  }
};
</script>

<style>
:root{
  color-scheme: light;
  --bg:#f4f4f2; --panel:#fcfcfb; --panel-2:#f0efec; --line:#e3e2de;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85837d;
  --accent:#2a78d6; --accent-soft:#e6effa;
  --s0:#a3a19a; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --today-ring:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#111110; --panel:#1a1a19; --panel-2:#232322; --line:#2f2f2d;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c85;
    --accent:#3987e5; --accent-soft:#1d2a3a;
    --s0:#6e6d67; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --today-ring:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111110; --panel:#1a1a19; --panel-2:#232322; --line:#2f2f2d;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c85;
  --accent:#3987e5; --accent-soft:#1d2a3a;
  --s0:#6e6d67; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --today-ring:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Noto Sans KR",system-ui,-apple-system,sans-serif}
a{color:var(--accent)}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.head{max-width:1320px;margin:0 auto;padding:14px 16px 6px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:19px;letter-spacing:-.01em}
.head .sub{color:var(--text-2);font-size:12.5px}
.head .grow{flex:1}
.head .upd{color:var(--muted);font-size:12px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
nav{max-width:1320px;margin:0 auto;padding:0 10px;display:flex;overflow-x:auto;scrollbar-width:none}
nav a{padding:10px 12px;text-decoration:none;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav a:hover{color:var(--text)}
nav a.active{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1320px;margin:0 auto;padding:20px 16px 56px}

/* ---------- common ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.panel-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.panel-h h2{font-size:15px;margin:0}
.panel-h .grow{flex:1}
.panel-b{padding:12px 16px 16px}
.page-title{font-size:18px;margin:0 0 4px}
.page-sub{color:var(--text-2);margin:0 0 16px;font-size:13px}
.msg{padding:40px 16px;text-align:center;color:var(--muted)}
.msg code{background:var(--panel-2);padding:2px 6px;border-radius:4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .k{color:var(--text-2);font-size:12.5px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{color:var(--muted);font-size:12px;word-break:keep-all;line-height:1.45;margin-top:2px}

.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--panel-2);color:var(--text-2);white-space:nowrap;border:1px solid var(--line)}
.tag-ad{display:inline-block;font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;border:1px solid currentColor;color:var(--text-2);margin-left:4px;vertical-align:1px}
.notice{font-size:12.5px;color:var(--text-2);background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-bottom:12px;white-space:pre-line}

/* ---------- home layout ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
@media (max-width:980px){.home-grid{grid-template-columns:1fr}}

/* ---------- calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-nav .m{font-weight:700;font-size:15px;min-width:96px;text-align:center}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.legend button .sw{width:10px;height:10px;border-radius:3px}
.legend button.off{opacity:.45}
.legend button.off .sw{background:transparent!important;border:1.5px solid var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:12px}
.cal .dow{font-size:12px;color:var(--text-2);text-align:center;padding:6px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel-2)}
.cal .dow.sun{color:#d14b4a}.cal .dow.sat{color:var(--accent)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;min-width:0;position:relative}
.day:hover{background:var(--panel-2)}
.day.out{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--panel-2) 6px 7px);cursor:default}
.day .n{font-size:12px;color:var(--text-2);display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%}
.day.today .n{background:var(--today-ring);color:#fff;font-weight:700}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ev{display:block;font-size:11.5px;line-height:1.35;padding:2px 5px 2px 6px;margin-top:3px;border-radius:4px;background:var(--panel-2);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.tent{border-left-style:dashed}
.more{font-size:11px;color:var(--muted);padding-left:6px}
@media (max-width:640px){
  .day{min-height:64px;padding:2px}
  .ev{font-size:10px;padding:1px 3px 1px 4px}
  .day .n{font-size:11px;width:20px;height:20px}
}
.day-detail{border-top:1px solid var(--line);padding:12px 16px 16px}
.day-detail h3{margin:0 0 8px;font-size:14px}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .dd{flex:0 0 auto;min-width:46px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;padding:3px 6px;background:var(--panel-2);color:var(--text-2)}
.list .dd.d0{background:var(--accent);color:#fff}
.list .body{flex:1;min-width:0}
.list .t{font-weight:500;overflow-wrap:anywhere}
.list .meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.list .sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.list .num{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12.5px;white-space:nowrap}

/* ---------- table ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar select{flex:0 1 auto}
.toolbar input,.toolbar select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.toolbar input{flex:1;min-width:160px}
.toolbar .count{color:var(--muted);font-size:12.5px;margin-left:auto}
.tbl-wrap{overflow:auto;max-height:72vh;border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);z-index:1;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;color:var(--text-2)}
th:hover{color:var(--text)}
th .ar{font-size:10px;margin-left:3px}
td{max-width:300px;word-break:keep-all;overflow-wrap:anywhere}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right}
td.nowrap{white-space:nowrap}
tbody tr:hover td{background:var(--panel-2)}
.chk{font-size:15px;color:var(--muted)}
.chk.on{color:var(--s3)}
.muted{color:var(--muted)}

/* ---------- 잠금 화면 ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock.hidden{display:none}
.lock-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.lock-card .ico{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.lock-card h1{font-size:18px;margin:0 0 4px}
.lock-card p{color:var(--text-2);font-size:13px;margin:0 0 18px;word-break:keep-all}
.lock-card input{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.lock-card input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.lock-card button{width:100%;font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px;background:var(--accent);color:#fff;cursor:pointer}
.lock-card button:disabled{opacity:.6;cursor:wait}
.lock-card .err{color:#d14b4a;font-size:12.5px;min-height:18px;margin-top:10px}
.lock-card label{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--text-2);margin:2px 0 12px}
.lock-card label input{width:auto;margin:0}
#app.hidden{display:none}
@media (max-width:640px){
  .head{padding:12px 16px 4px;gap:8px}
  .head .grow,.head .upd{display:none}
  .head .icon-btn{padding:5px 8px;font-size:12px}
  .head > div:first-child{flex:1;min-width:0}
  .tile .v{font-size:22px}
}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px;margin-bottom:16px}
.chart{position:relative;margin-top:8px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .dl{fill:var(--text);font-size:12px;font-weight:700}
.chart .hl{fill:var(--panel-2)}
.chart .tip{position:absolute;top:4px;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.12);white-space:nowrap;transform:translateX(-50%);z-index:2}
.chart .tip b{display:block;margin-bottom:2px}
.chart .tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.panel-note{color:var(--muted);font-size:12px;margin-top:6px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.timeline li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.timeline .mo{font-weight:700}
.timeline .tx{margin-top:4px;word-break:keep-all}
.react-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:12px}
</style>
</head>
<body>
<div id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 id="lockTitle">대시보드</h1>
    <p>내부 공유용 페이지입니다. 비밀번호를 입력해 주세요.</p>
    <input type="password" id="pw" placeholder="비밀번호" aria-label="비밀번호" required autofocus>
    <label><input type="checkbox" id="remember" checked> 이 탭에서 로그인 유지</label>
    <button type="submit" id="unlockBtn">들어가기</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>
<div id="app" class="hidden">
<header>
  <div class="head">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="grow"></div>
    <span class="upd" id="upd"></span>
    <button class="icon-btn" id="logoutBtn" title="잠그기">잠금</button>
    <button class="icon-btn" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">다크/라이트</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"><div class="msg">불러오는 중…</div></main>
</div>

<script>
/* ======================= 유틸 ======================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").replace(/\s+/g, "");
const DOW = ["일","월","화","수","목","금","토"];
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const sameDay = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dayDiff = d => Math.round((d - today) / 86400000);
const fmtDate = d => `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`;
const ddLabel = d => { const n = dayDiff(d); return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`; };

// 숫자: "1,234" / "3.1만" / "1.2천" / "2억" / "₩50,000"
function num(v){
  const s = String(v ?? "").replace(/[,₩원배\s]/g, "");
  const m = s.match(/^(-?\d+(?:\.\d+)?)(백|천|만|억)?$/);
  if (!m) return null;
  return parseFloat(m[1]) * ({백:1e2, 천:1e3, 만:1e4, 억:1e8}[m[2]] || 1);
}
const compact = n => n >= 1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,"")+"억"
                   : n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,"")+"만"
                   : Math.round(n).toLocaleString("ko-KR");

// 날짜: 2026.10.27 / 2026-10-27 / 2026년 10월 27일 / 26.10.27 / 10/27
function parseDate(v){
  const s = String(v ?? "").trim(); if (!s) return null;
  let m = s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{2})\.(\d{1,2})\.(\d{1,2})/);
  if (m) return new Date(2000 + +m[1], +m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})\s*[\/월]\s*(\d{1,2})/);
  if (m) return new Date(CONFIG.startYear, +m[1]-1, +m[2]);
  return null;
}

let BUNDLE = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBundle(pw){
  const enc = ENCRYPTED_DATA;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(enc.salt), iterations:enc.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.iv)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchRows(file){
  const name = file.split("/").pop();
  const text = BUNDLE.files[name];
  if (text === undefined) throw new Error(`${name} 데이터가 data.enc 안에 없습니다`);
  const rows = Papa.parse(text.replace(/^\uFEFF/, ""), {skipEmptyLines:false}).data.map(r => r.map(c => String(c ?? "").trim()));
  return {rows, modified: BUNDLE.updated};
}

// 달력형 시트("10월 스케줄" + 날짜칸 + 바로 아래 일정칸)
function parseCalendar(rows){
  let firstMonth = null;
  const dateAt = new Set(), skip = new Set(), events = [], notes = [];
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    const mh = c.match(/^(\d{1,2})월\s*스케줄$/);
    if (mh){ skip.add(ri+","+ci); if (firstMonth === null) firstMonth = +mh[1]; }
    if (/^\d{1,2}\/\d{1,2}$/.test(c)) dateAt.add(ri+","+ci);
  }));
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    if (!dateAt.has(ri+","+ci)) return;
    const [m,d] = c.split("/").map(Number);
    const year = CONFIG.startYear + (firstMonth && m < firstMonth ? 1 : 0);
    const below = (rows[ri+1] || [])[ci] || "";
    skip.add((ri+1)+","+ci);
    if (below && !dateAt.has((ri+1)+","+ci)){
      below.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(text =>
        events.push({date:new Date(year, m-1, d), text}));
    }
  }));
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    const k = ri+","+ci;
    if (!c || skip.has(k) || dateAt.has(k) || DOW.includes(c) || c === "메모장") return;
    const t = c.replace(/^\s*\[비고\]\s*/, "").trim();
    if (t) notes.push(t);
  }));
  return {kind:"calendar", events, notes};
}

// 표형 시트 — 제목줄/빈 열/빈 행 자동 정리
function parseTable(rows){
  const filled = r => r.filter(c => c !== "").length;
  let hi = rows.findIndex((r,i) => filled(r) >= 3 && rows[i+1] && filled(rows[i+1]) >= 2);
  if (hi < 0) hi = 0;
  let title = "";
  for (let i = 0; i < hi && !title; i++) title = rows[i].find(c => c) || "";
  const head = rows[hi] || [];
  const body = rows.slice(hi+1);
  const width = Math.max(head.length, ...body.map(r => r.length));
  const cols = [];
  for (let ci = 0; ci < width; ci++){
    const vals = body.map(r => r[ci] || "").filter(Boolean);
    let h = head[ci] || "";
    if (!h && !vals.length) continue;                 // 완전히 빈 열은 제거
    if (!h) h = vals.every(v => /^\d+$/.test(v)) ? "No." : "구분";
    cols.push({ci, h});
  }
  // 같은 이름 열 구분
  const seen = {};
  cols.forEach(c => { seen[c.h] = (seen[c.h]||0) + 1; if (seen[c.h] > 1) c.h += " " + seen[c.h]; });
  // 번호/체크박스/"바로가기"만 있는 빈 행 제거
  const filler = /^(TRUE|FALSE|바로가기|\d+)$/i;
  const data = body
    .map(r => cols.map(c => r[c.ci] || ""))
    .filter(r => r.some(v => v && !filler.test(v)));
  return {kind:"table", title, headers: cols.map(c => c.h), data};
}

// 월별 지표 시트 — 헤더에 "1월"~"12월", 병합 셀(크리에이터)은 아래로 채움, "-"·빈칸은 값 없음(0 아님)
function parseMetrics(rows){
  const isMonth = c => /^\d{1,2}월$/.test(c);
  const hi = rows.findIndex(r => r.filter(isMonth).length >= 6);
  const head = rows[hi];
  const mcols = head.map((c,i) => isMonth(c) ? {i, m: parseInt(c)} : null).filter(Boolean);
  let li = head.findIndex(c => c === "구분"); if (li < 0) li = mcols[0].i - 2;
  const ei = head.findIndex(c => c);                       // 첫 헤더 = 크리에이터 열
  let title = ""; for (let k = 0; k < hi && !title; k++) title = rows[k].find(c => c) || "";
  let entity = "";
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    if (ei !== li && r[ei]) entity = r[ei];                // 병합 셀 채우기
    const label = r[li]; if (!label) return;
    const raw = mcols.map(({i}) => r[i] || "");
    const values = raw.map(v => (v === "" || v === "-") ? null : num(v));
    const text = values.every(v => v === null) && raw.some(v => v && v !== "-");
    out.push({entity, label, raw, values, text});
  });
  return {kind:"metrics", title, entityHeader: ei !== li ? head[ei] : "", months: mcols.map(x => x.m), rows: out};
}

const fmtN = v => Math.round(v).toLocaleString("ko-KR");
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtN(Math.abs(v));
function channelSummary(d){
  const C = CONFIG.channel || {};
  const R = k => C[k] ? d.rows.find(r => norm(r.label) === norm(C[k])) || null : null;
  const M = i => d.months[i] + "월";
  const lastIdx = arr => { for (let k = arr.length - 1; k >= 0; k--) if (arr[k] !== null) return k; return null; };
  const prevIdx = (arr, k) => { for (let j = k - 1; j >= 0; j--) if (arr[j] !== null) return j; return null; };
  const stock = r => { if (!r) return null; const k = lastIdx(r.values); if (k === null) return null;
    const j = prevIdx(r.values, k); return {v: r.values[k], m: M(k), dv: j !== null ? r.values[k] - r.values[j] : null, pm: j !== null ? M(j) : null}; };
  const rows = {subs:R("ytSubs"), lg:R("ytLong"), sh:R("ytShort"), igf:R("igFollowers"), igv:R("igViews"), rc:R("reactions"), tg:R("target")};
  const out = {rows, M, subs: stock(rows.subs), igf: stock(rows.igf), igv: stock(rows.igv)};
  if (rows.lg || rows.sh){
    const tot = d.months.map((_,i) => { const a = rows.lg?.values[i] ?? null, b = rows.sh?.values[i] ?? null; return a === null && b === null ? null : (a || 0) + (b || 0); });
    const k = lastIdx(tot);
    if (k !== null){ const j = prevIdx(tot, k);
      out.yt = {v: tot[k], m: M(k), long: rows.lg?.values[k] ?? null, short: rows.sh?.values[k] ?? null,
                pct: j !== null && tot[j] ? (tot[k] - tot[j]) / tot[j] * 100 : null, pm: j !== null ? M(j) : null}; }
    const sum = r => r ? r.values.reduce((a,v) => a + (v || 0), 0) : 0;
    const filled = tot.map((v,i) => v !== null ? i : -1).filter(i => i >= 0);
    out.ytTotal = {v: sum(rows.lg) + sum(rows.sh), long: sum(rows.lg), short: sum(rows.sh),
                   range: filled.length ? `${M(filled[0])}~${M(filled[filled.length-1])}` : ""};
  }
  return out;
}

// 간단한 SVG 차트 (꺾은선 / 묶은 막대) — 마우스·터치 툴팁 포함
const niceStep = (range, n) => { const raw = range / n || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
function mountChart(host, spec){
  let lastW = 0;
  const draw = () => {
    const W = Math.max(280, host.clientWidth); lastW = host.clientWidth;
    const H = spec.h || 230, M = {t:22, r:14, b:26, l:50};
    const n = spec.labels.length, pw = W - M.l - M.r, ph = H - M.t - M.b, bw = pw / n;
    const all = spec.series.flatMap(s => s.values).filter(v => v !== null);
    if (!all.length){ host.innerHTML = `<div class="msg">입력된 값이 없습니다</div>`; return; }
    let lo = spec.type === "bar" || spec.zero ? 0 : Math.min(...all), hi = Math.max(...all);
    if (spec.type === "line" && !spec.zero){ const pad = (hi - lo) * 0.25 || hi * 0.02 || 1; lo -= pad; hi += pad; }
    if (hi === lo) hi = lo + 1;
    const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const y = v => M.t + ph - (v - lo) / (hi - lo) * ph, xc = i => M.l + bw * (i + 0.5);
    let g = `<rect class="hl" x="0" y="${M.t}" width="0" height="${ph}" rx="6"/>`;
    for (let t = lo; t <= hi + step / 2; t += step)
      g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${M.l - 8}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`;
    spec.labels.forEach((l,i) => g += `<text class="ax" x="${xc(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`);
    let marks = "";
    if (spec.type === "bar"){
      const k = spec.series.length, gw = Math.min(bw * 0.7, 30 * k + 2 * (k - 1)), w = (gw - 2 * (k - 1)) / k;
      spec.series.forEach((s,si) => s.values.forEach((v,i) => {
        if (v === null) return;
        const x = xc(i) - gw / 2 + si * (w + 2), top = y(v), base = y(lo), r = Math.min(4, w / 2, Math.max(base - top, 0));
        marks += `<path d="M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${base}Z" fill="var(--s${s.color})"/>`;
      }));
    } else {
      spec.series.forEach(s => {
        let d = "", pen = false;
        s.values.forEach((v,i) => { if (v === null){ pen = false; return; } d += (pen ? "L" : "M") + xc(i) + "," + y(v); pen = true; });
        marks += `<path d="${d}" fill="none" stroke="var(--s${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.values.forEach((v,i) => { if (v !== null) marks += `<circle cx="${xc(i)}" cy="${y(v)}" r="4.5" fill="var(--s${s.color})" stroke="var(--panel)" stroke-width="2"/>`; });
        if (spec.series.length === 1){
          const idx = s.values.map((v,i) => v !== null ? i : -1).filter(i => i >= 0), li = idx[idx.length - 1];
          if (li !== undefined) marks += `<text class="dl" x="${xc(li)}" y="${y(s.values[li]) - 11}" text-anchor="${li === n - 1 ? "end" : "middle"}">${fmtN(s.values[li])}</text>`;
        }
      });
    }
    let hits = ""; for (let i = 0; i < n; i++) hits += `<rect data-i="${i}" x="${M.l + bw * i}" y="${M.t}" width="${bw}" height="${ph}" fill="transparent"/>`;
    host.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.title || "")}">${g}${marks}${hits}</svg><div class="tip" hidden></div>`;
    const tip = $(".tip", host), hl = $(".hl", host);
    host.querySelectorAll("rect[data-i]").forEach(r => {
      const show = () => {
        const i = +r.dataset.i;
        const lines = spec.series.map(s => `<div><i style="background:var(--s${s.color})"></i>${esc(s.name)} <b style="display:inline">${s.values[i] === null ? "값 없음" : fmtN(s.values[i])}</b></div>`)
          .concat((spec.extra || []).map(e => e.values[i] === null ? "" : `<div class="muted">${esc(e.name)} ${fmtN(e.values[i])}</div>`)).join("");
        tip.innerHTML = `<b>${esc(spec.labels[i])}</b>${lines}`; tip.hidden = false;
        tip.style.left = Math.min(Math.max(xc(i), 80), W - 80) + "px";
        hl.setAttribute("x", M.l + bw * i + 2); hl.setAttribute("width", Math.max(bw - 4, 0));
      };
      r.addEventListener("pointerenter", show); r.addEventListener("pointerdown", show);
    });
    host.querySelector("svg").addEventListener("pointerleave", () => { tip.hidden = true; hl.setAttribute("width", 0); });
  };
  draw();
  if (window.ResizeObserver) new ResizeObserver(() => { if (host.clientWidth !== lastW) draw(); }).observe(host);
}

const store = {};      // id → parsed
let latestMod = null;
async function loadPage(p){
  if (store[p.id]) return store[p.id];
  try {
    const {rows, modified} = await fetchRows(p.file);
    if (modified){ const d = new Date(modified); if (!latestMod || d > latestMod) latestMod = d; }
    const isCal = rows.some(r => r.some(c => /^\d{1,2}월\s*스케줄$/.test(c)));
    const isMetrics = rows.some(r => r.filter(c => /^\d{1,2}월$/.test(c)).length >= 6);
    store[p.id] = !rows.length ? {kind:"empty"} : isCal ? parseCalendar(rows) : isMetrics ? parseMetrics(rows) : parseTable(rows);
  } catch(e){ store[p.id] = {kind:"error", message:e.message}; }
  return store[p.id];
}

/* ======================= 달력 레이어 ======================= */
function buildLayers(){
  const layers = [];
  CONFIG.pages.forEach(p => {
    const d = store[p.id]; if (!d) return;
    if (p.layer && d.kind === "calendar"){
      layers.push({id:p.id, label:p.layer.label, color:p.layer.color, off:!!p.layer.off,
        events: d.events.map(e => ({...e, tent:/예정/.test(e.text), ad:/광고|PPL|협찬|공구/i.test(e.text)})),
        notes: d.notes});
    }
    if (p.dateLayer && d.kind === "table"){
      const L = p.dateLayer, di = d.headers.indexOf(L.col);
      if (di < 0) return;
      const ti = (L.titleCols || []).map(h => d.headers.indexOf(h)).filter(i => i >= 0);
      const events = d.data.map(r => {
        const date = parseDate(r[di]); if (!date) return null;
        const text = ti.map(i => r[i]).filter(Boolean).join(" · ") || L.label;
        return {date, text, tent:false, ad:p.id === CONFIG.home.inquiries.page};
      }).filter(Boolean);
      layers.push({id:p.id+"-date", label:L.label, color:L.color, off:!!L.off, events, notes:[]});
    }
  });
  return layers;
}
const layerState = {};   // 범례 on/off 기억
const isOn = l => layerState[l.id] ?? !l.off;

function calendarPanel(layers, opts={}){
  const wrap = document.createElement("section");
  wrap.className = "panel";
  let cur = new Date(today.getFullYear(), today.getMonth(), 1);
  let sel = null;

  const draw = () => {
    const y = cur.getFullYear(), m = cur.getMonth();
    const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
    const active = layers.filter(isOn);
    const evOn = d => active.flatMap(l => l.events.filter(e => sameDay(e.date, d)).map(e => ({...e, layer:l})));
    let cells = DOW.map((d,i) => `<div class="dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("");
    for (let i = 0; i < first.getDay(); i++) cells += `<div class="day out"></div>`;
    for (let dn = 1; dn <= days; dn++){
      const d = new Date(y, m, dn), evs = evOn(d);
      const shown = evs.slice(0, 3).map(e =>
        `<span class="ev ${e.tent?"tent":""}" style="--c:var(--s${e.layer.color})" title="${esc(e.layer.label+": "+e.text)}">${esc(e.text)}</span>`).join("");
      cells += `<div class="day ${sameDay(d,today)?"today":""} ${sameDay(d,sel)?"sel":""}" data-d="${dn}">
        <span class="n">${dn}</span>${shown}${evs.length>3?`<div class="more">+${evs.length-3}</div>`:""}</div>`;
    }
    const rest = (7 - (first.getDay()+days) % 7) % 7;
    for (let i = 0; i < rest; i++) cells += `<div class="day out"></div>`;

    let detail = "";
    if (sel && sel.getMonth() === m){
      const evs = evOn(sel);
      detail = `<div class="day-detail"><h3>${sel.getMonth()+1}월 ${sel.getDate()}일 (${DOW[sel.getDay()]}) · ${ddLabel(sel)}</h3>
        ${evs.length ? `<ul class="list">${evs.map(e => eventLi(e, false)).join("")}</ul>` : `<div class="muted">등록된 일정이 없습니다</div>`}</div>`;
    }
    wrap.innerHTML = `
      <div class="panel-h">
        <h2>${esc(opts.title || "일정 달력")}</h2><div class="grow"></div>
        <div class="cal-nav">
          <button class="icon-btn" data-nav="-1" aria-label="이전 달">‹</button>
          <span class="m">${y}년 ${m+1}월</span>
          <button class="icon-btn" data-nav="1" aria-label="다음 달">›</button>
          <button class="icon-btn" data-nav="0">오늘</button>
        </div>
      </div>
      ${layers.length > 1 ? `<div class="legend">${layers.map(l =>
        `<button data-l="${l.id}" class="${isOn(l)?"":"off"}" aria-pressed="${isOn(l)}"><span class="sw" style="background:var(--s${l.color})"></span>${esc(l.label)} <span class="muted">${l.events.length}</span></button>`).join("")}</div>` : ""}
      <div style="padding:0 16px 16px"><div class="cal">${cells}</div></div>${detail}`;

    wrap.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      cur = n === 0 ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(y, m+n, 1);
      if (n === 0) sel = today;
      draw();
    });
    wrap.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
      const l = layers.find(x => x.id === b.dataset.l); layerState[l.id] = !isOn(l);
      draw(); opts.onLayer && opts.onLayer();
    });
    wrap.querySelectorAll(".day[data-d]").forEach(c => c.onclick = () => {
      const d = new Date(y, m, +c.dataset.d); sel = sameDay(sel, d) ? null : d; draw();
    });
  };
  draw();
  return wrap;
}

function eventLi(e, withDate=true){
  const n = dayDiff(e.date);
  return `<li>
    ${withDate ? `<span class="dd ${n===0?"d0":""}">${ddLabel(e.date)}</span>` : ""}
    <div class="body">
      <div class="t">${esc(e.text)}${e.ad?'<span class="tag-ad">광고</span>':""}</div>
      <div class="meta"><span class="sw" style="background:var(--s${e.layer.color})"></span>${esc(e.layer.label)}${withDate?" · "+fmtDate(e.date):""}${e.tent?" · 예정":""}</div>
    </div></li>`;
}

function renderHome(view){

    const views = vi >= 0 ? rows.reduce((a,r) => a + (num(r[vi]) || 0), 0) : 0;
    const fmt = {}; if (fi >= 0) rows.forEach(r => { if (r[fi]) fmt[r[fi]] = (fmt[r[fi]]||0)+1; });
    tiles.push(["업로드 콘텐츠", rows.length + "개", Object.entries(fmt).map(([k,v]) => `${k} ${v}`).join(" · ")]);
    if (vi >= 0) tiles.push(["영상 조회수 합계", compact(views), `콘텐츠 시트 기준 · 평균 ${compact(views / (rows.length||1))}회`]);
    recent = rows.map(r => ({r, d: parseDate(r[di])})).filter(x => x.d).sort((a,b) => b.d - a.d).slice(0, 5)
      .map(({r,d}) => ({d, title: r[ti] || "", fmt: fi>=0 ? r[fi] : "", views: vi>=0 ? r[vi] : ""}));
  }

  // 안내문(※…)은 맨 위, 나머지 비고는 옆 패널
  const notes = [...new Set(layers.flatMap(l => l.notes))];
  const disclaimers = notes.filter(n => n.startsWith("※"));
  const memo = layers.map(l => ({l, notes: l.notes.filter(n => !n.startsWith("※"))})).filter(x => x.notes.length);

  view.innerHTML = `
    <div class="tiles">${tiles.map(([k,v,s]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s" title="${esc(s)}">${esc(s)}</div></div>`).join("")}</div>
    ${disclaimers.map(d => `<div class="notice">${esc(d)}</div>`).join("")}
    <div class="home-grid">
      <div id="calSlot"></div>
      <div class="side">
        <section class="panel"><div class="panel-h"><h2>다가오는 일정</h2><div class="grow"></div><span class="muted" style="font-size:12px">30일</span></div>
          <div class="panel-b" id="upcoming"></div></section>
        ${recent.length ? `<section class="panel"><div class="panel-h"><h2>최근 업로드</h2></div><div class="panel-b">
          <ul class="list">${recent.map(x => `<li><span class="dd">${x.d.getMonth()+1}/${x.d.getDate()}</span>
            <div class="body"><div class="t">${esc(x.title)}</div><div class="meta">${esc(x.fmt)}</div></div>
            <span class="num">${x.views ? "▶ "+esc(x.views) : ""}</span></li>`).join("")}</ul></div></section>` : ""}
        ${memo.length ? `<section class="panel"><div class="panel-h"><h2>비고 · 전달사항</h2></div><div class="panel-b">
          ${memo.map(x => `<div class="meta" style="font-size:12px;color:var(--muted);margin:4px 0"><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s${x.l.color})"></span> ${esc(x.l.label)}</div>
            ${x.notes.map(n => `<div class="notice">${esc(n)}</div>`).join("")}`).join("")}
        </div></section>` : ""}
      </div>
    </div>`;

  const drawUpcoming = () => {
    const list = layers.filter(isOn).flatMap(l => l.events.map(e => ({...e, layer:l})))
      .filter(e => { const n = dayDiff(e.date); return n >= 0 && n <= 30; })
      .sort((a,b) => a.date - b.date);
    $("#upcoming").innerHTML = list.length ? `<ul class="list">${list.map(e => eventLi(e)).join("")}</ul>`
      : `<div class="muted">앞으로 30일 안에 등록된 일정이 없습니다</div>`;
  };
  $("#calSlot").appendChild(calendarPanel(layers, {title:"광고 · 업로드 · 개인 일정", onLayer: drawUpcoming}));
  drawUpcoming();
}

/* ======================= 달력 시트 탭 ======================= */
function renderCalendarPage(view, p, d){
  const layer = {id:p.id, label:p.layer?.label || p.label, color:p.layer?.color ?? 1, off:false,
    events: d.events.map(e => ({...e, tent:/예정/.test(e.text), ad:/광고|PPL|협찬|공구/i.test(e.text)})), notes:d.notes};
  const evs = layer.events.map(e => ({...e, layer})).sort((a,b) => a.date - b.date);
  const up = evs.filter(e => dayDiff(e.date) >= 0), past = evs.filter(e => dayDiff(e.date) < 0);
  view.innerHTML = `
    <h2 class="page-title">${esc(p.label)}</h2>
    <p class="page-sub">전체 ${evs.length}건 · 예정 ${up.length}건 · 지난 일정 ${past.length}건</p>
    ${d.notes.map(n => `<div class="notice">${esc(n)}</div>`).join("")}
    <div class="home-grid"><div id="calSlot"></div>
      <div class="side">
        <section class="panel"><div class="panel-h"><h2>예정</h2></div><div class="panel-b">
          ${up.length ? `<ul class="list">${up.map(e => eventLi(e)).join("")}</ul>` : `<div class="muted">예정된 일정이 없습니다</div>`}</div></section>
        ${past.length ? `<section class="panel"><div class="panel-h"><h2>지난 일정</h2></div><div class="panel-b">
          <ul class="list">${past.reverse().map(e => eventLi(e)).join("")}</ul></div></section>` : ""}
      </div></div>`;
  $("#calSlot").appendChild(calendarPanel([layer], {title: p.label}));
}

/* ======================= 표 시트 탭 ======================= */
// 반응 분석: 포맷별 중앙값 대비 조회수·참여율로 등급을 매기고 "반응"/"조회수 배수" 열을 추가
const median = a => { const b = a.slice().sort((x,y) => x-y), n = b.length; return n ? (n % 2 ? b[(n-1)/2] : (b[n/2-1] + b[n/2]) / 2) : 0; };
function addReaction(d, R){
  const H = d.headers, gi = H.indexOf(R.groupCol), ti = H.indexOf(R.titleCol), vi = H.indexOf(R.viewsCol),
        li = H.indexOf(R.likeCol), ci = H.indexOf(R.commentCol);
  if (vi < 0) return {d, html:""};
  const info = d.data.map(r => {
    const v = num(r[vi]), e = v ? ((num(r[li]) || 0) + (num(r[ci]) || 0)) / v : null;
    return {g: gi >= 0 ? (r[gi] || "기타") : "전체", v, e};
  });
  const groups = {};
  info.forEach(x => { if (x.v) (groups[x.g] ||= {vs:[], es:[]}).vs.push(x.v), groups[x.g].es.push(x.e); });
  Object.values(groups).forEach(g => { g.mv = median(g.vs); g.me = median(g.es); });
  info.forEach(x => {
    const g = groups[x.g]; x.label = ""; x.ratio = null;
    if (!x.v || !g) return;
    x.ratio = x.v / g.mv;
    if (x.ratio >= R.hot) x.label = "🔥 화제";
    else if (x.ratio >= R.high) x.label = "👍 조회수 높음";
    else if (x.e >= g.me * R.engage && x.ratio >= 0.5) x.label = "💬 참여율 높음";
  });
  const at = ti >= 0 ? ti + 1 : H.length;
  const nd = {...d,
    headers: [...H.slice(0, at), "반응", "조회수 배수", ...H.slice(at)],
    data: d.data.map((r,i) => [...r.slice(0, at), info[i].label, info[i].ratio ? info[i].ratio.toFixed(1) + "배" : "", ...r.slice(at)])};

  // 포맷별 TOP
  const rows = d.data.map((r,i) => ({r, ...info[i]})).filter(x => x.v);
  const html = Object.keys(groups).map(g => {
    const top = rows.filter(x => x.g === g).sort((a,b) => b.v - a.v).slice(0, R.top);
    const cnt = rows.filter(x => x.g === g && x.label).length;
    return `<section class="panel"><div class="panel-h"><h2>${esc(g)} 반응 TOP ${R.top}</h2><div class="grow"></div>
      <span class="muted" style="font-size:12px">중앙값 ${compact(groups[g].mv)}회 · 반응 좋음 ${cnt}개</span></div>
      <div class="panel-b"><ul class="list">${top.map((x,k) => `<li><span class="dd ${k===0?"d0":""}">${k+1}위</span>
        <div class="body"><div class="t">${esc(x.r[ti] || "")}</div>
        <div class="meta">${esc(x.label || "")}${x.label?" · ":""}중앙값의 ${x.ratio.toFixed(1)}배 · 참여율 ${(x.e*100).toFixed(1)}%</div></div>
        <span class="num">▶ ${esc(x.r[vi])}</span></li>`).join("")}</ul></div></section>`;
  }).join("");
  const note = `<div class="notice" style="margin-top:0">반응 기준 (롱폼·숏폼 각각 따로 비교) — 🔥 화제: 조회수가 같은 포맷 중앙값의 ${R.hot}배 이상 · 👍 조회수 높음: ${R.high}배 이상 · 💬 참여율 높음: (좋아요+댓글)÷조회수가 중앙값의 ${R.engage}배 이상</div>`;
  return {d: nd, html: `<div class="react-grid">${html}</div>${note}`};
}

function renderTablePage(view, p, d){
  let reactHTML = "";
  if (p.reaction){ const r = addReaction(d, p.reaction); d = r.d; reactHTML = r.html; }
  const hide = new Set(p.hide || []);
  const idx = d.headers.map((h,i) => i).filter(i => !hide.has(d.headers[i]));
  const badgeCols = new Set((p.badges || []).map(h => d.headers.indexOf(h)));
  const filterCols = (p.filters || []).map(h => d.headers.indexOf(h)).filter(i => i >= 0);
  const isNumCol = i => { const v = d.data.map(r => r[i]).filter(Boolean); return v.length > 0 && v.every(x => num(x) !== null) && !/^No\.?$/.test(d.headers[i]); };
  const isDateCol = i => { const v = d.data.map(r => r[i]).filter(Boolean); return v.length > 0 && v.every(x => parseDate(x)); };
  const numCols = new Set(idx.filter(isNumCol)), dateCols = new Set(idx.filter(isDateCol));
  const st = {q:"", f:{}, sort: p.sort ? d.headers.indexOf(p.sort.col) : -1, dir: p.sort?.dir || 1};

  // 요약 타일: 건수 + 숫자 열 합계 + 첫 필터 상위값
  const tiles = [["전체", d.data.length + "건"]];
  idx.filter(i => numCols.has(i) && /(조회|좋아요|댓글|단가|금액|수익|매출|비용)/.test(d.headers[i]) && !/배수/.test(d.headers[i])).forEach(i =>
    tiles.push([d.headers[i] + " 합계", compact(d.data.reduce((a,r) => a + (num(r[i])||0), 0))]));
  if (filterCols[0] !== undefined){
    const c = {}; d.data.forEach(r => { const v = r[filterCols[0]]; if (v) c[norm(v)] = [(c[norm(v)]?.[0]||0)+1, v]; });
    Object.values(c).sort((a,b)=>b[0]-a[0]).slice(0, 3).forEach(([n,v]) => tiles.push([v, n + "건"]));
  }

  const opts = i => {
    const c = {}; d.data.forEach(r => { const v = r[i]; if (v) c[norm(v)] = [(c[norm(v)]?.[0]||0)+1, c[norm(v)]?.[1] || v]; });
    return Object.entries(c).sort((a,b) => b[1][0]-a[1][0]);
  };
  view.innerHTML = `
    <h2 class="page-title">${esc(p.label)}</h2>
    <p class="page-sub">${esc(d.title)}</p>
    <div class="tiles">${tiles.map(([k,v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>
    ${reactHTML}
    <section class="panel" style="padding:12px">
      <div class="toolbar">
        <input type="search" id="q" placeholder="검색 (브랜드, 제목, 담당자 등)">
        ${filterCols.map(i => { const o = opts(i); return o.length ? `<select data-f="${i}" aria-label="${esc(d.headers[i])}">
          <option value="">${esc(d.headers[i])}: 전체</option>${o.map(([k,[n,v]]) => `<option value="${esc(k)}">${esc(v)} (${n})</option>`).join("")}</select>` : ""; }).join("")}
        <span class="count" id="count"></span>
      </div>
      <div class="tbl-wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    </section>`;

  const cell = (v, i) => {
    if (!v) return "";
    if (/^(TRUE|FALSE)$/i.test(v)) return `<span class="chk ${/TRUE/i.test(v)?"on":""}">${/TRUE/i.test(v)?"☑":"☐"}</span>`;
    if (badgeCols.has(i)) return `<span class="badge">${esc(v)}</span>`;
    if (/^https?:\/\/\S+$/.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">열기 ↗</a>`;
    if (v === "바로가기") return `<span class="muted" title="CSV로 내보내면 시트의 하이퍼링크가 사라집니다. URL 원문을 넣어주세요.">—</span>`;
    const em = v.match(/^\s*"?([^"<]*?)"?\s*<([^>\s]+@[^>\s]+)>\s*$/);
    if (em) return `${esc(em[1].trim() || em[2])}<br><a href="mailto:${esc(em[2])}" class="muted" style="font-size:12px">${esc(em[2])}</a>`;
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    return esc(v).replace(/\n/g, "<br>");
  };

  const draw = () => {
    let rows = d.data.slice();
    if (st.q) rows = rows.filter(r => r.some(c => c.toLowerCase().includes(st.q)));
    Object.entries(st.f).forEach(([i,v]) => { if (v) rows = rows.filter(r => norm(r[i]) === v); });
    if (st.sort >= 0){
      const i = st.sort;
      rows.sort((a,b) => {
        const A = a[i], B = b[i];
        if (!A && !B) return 0; if (!A) return 1; if (!B) return -1;     // 빈 칸은 항상 아래
        const da = parseDate(A), db = parseDate(B);
        if (da && db) return (da - db) * st.dir;
        const na = num(A), nb = num(B);
        if (na !== null && nb !== null) return (na - nb) * st.dir;
        return A.localeCompare(B, "ko") * st.dir;
      });
    }
    $("#th").innerHTML = "<tr>" + idx.map(i =>
      `<th data-i="${i}" class="${numCols.has(i)?"num":""}">${esc(d.headers[i])}<span class="ar">${i===st.sort?(st.dir>0?"▲":"▼"):""}</span></th>`).join("") + "</tr>";
    $("#tb").innerHTML = rows.length ? rows.map(r => "<tr>" + idx.map(i =>
      `<td class="${numCols.has(i)?"num":""} ${dateCols.has(i)?"nowrap":""}">${cell(r[i], i)}</td>`).join("") + "</tr>").join("")
      : `<tr><td colspan="${idx.length}" class="msg">조건에 맞는 항목이 없습니다</td></tr>`;
    $("#count").textContent = `${rows.length} / ${d.data.length}건`;
    view.querySelectorAll("th[data-i]").forEach(th => th.onclick = () => {
      const i = +th.dataset.i;
      if (st.sort === i) st.dir *= -1; else { st.sort = i; st.dir = 1; }
      draw();
    });
  };
  $("#q").oninput = e => { st.q = e.target.value.toLowerCase(); draw(); };
  view.querySelectorAll("select[data-f]").forEach(s => s.onchange = () => { st.f[s.dataset.f] = s.value; draw(); });
  draw();
}

/* ======================= 라우팅 ======================= */
function currentPage(){
  const id = location.hash.slice(1);
  return CONFIG.pages.find(p => p.id === id && p.tab !== false) || CONFIG.pages[0];
}
function render(){
  const page = currentPage();
  $("#tabs").innerHTML = CONFIG.pages.filter(p => p.tab !== false).map(p =>
    `<a href="#${p.id}" class="${p.id===page.id?"active":""}">${esc(p.label)}</a>`).join("");
  document.title = `${page.label} · ${CONFIG.title}`;
  const view = $("#view");
  if (page.type === "home") return renderHome(view);
  const d = store[page.id];
  if (!d || d.kind === "error") view.innerHTML = `<div class="msg">⚠️ ${esc(d?.message || "불러오지 못했습니다")}<br><br>저장소에 <code>${esc(page.file)}</code> 파일이 있는지 확인해 주세요.</div>`;
  else if (d.kind === "empty") view.innerHTML = `<div class="msg"><code>${esc(page.file)}</code> 파일이 비어 있습니다.</div>`;
  else if (d.kind === "calendar") renderCalendarPage(view, page, d);
  else if (d.kind === "metrics") renderMetricsPage(view, page, d);
  else renderTablePage(view, page, d);
  window.scrollTo(0, 0);
}

async function start(){
  $("#lock").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#title").textContent = CONFIG.title;
  $("#subtitle").textContent = CONFIG.subtitle;
  await Promise.all(CONFIG.pages.filter(p => p.file).map(loadPage));
  if (latestMod) $("#upd").textContent = "데이터 업데이트 " + latestMod.toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
  render();
  window.addEventListener("hashchange", render);
}

async function tryUnlock(pw, remember){
  try {
    BUNDLE = await decryptBundle(pw);
  } catch(e){
    return e.message === "NOFILE" ? "data/data.enc 파일을 찾을 수 없습니다" : "비밀번호가 올바르지 않습니다";
  }
  try { remember ? sessionStorage.setItem("dash-pw", pw) : sessionStorage.removeItem("dash-pw"); } catch {}
  await start();
  return "";
}

(async function initLock(){
  $("#lockTitle").textContent = CONFIG.title;
  let saved = null;
  try { saved = sessionStorage.getItem("dash-pw"); } catch {}
  if (saved && !(await tryUnlock(saved, true))) return;
  $("#lockForm").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#unlockBtn"); btn.disabled = true; $("#lockErr").textContent = "";
    const err = await tryUnlock($("#pw").value, $("#remember").checked);
    btn.disabled = false;
    if (err){ $("#lockErr").textContent = err; $("#pw").select(); }
  };
  $("#pw").focus();
})();

$("#logoutBtn").onclick = () => {
  try { sessionStorage.removeItem("dash-pw"); } catch {}
  location.reload();
};

// 테마 전환 (이 브라우저에만 기억)
(function(){
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("#themeBtn").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
  };
})();
</script>
